# Дополнение к службе Caddy (systemd): admin API прокси — только на Unix-сокете в закрытом каталоге.
#
# Зачем. Контейнер Hermes работает в сети хоста, поэтому стандартный admin API Caddy на
# localhost:2019 ассистенту доступен: через него можно перенастроить прокси. Образец
# config/Caddyfile.example переносит admin API на сокет /run/caddy-admin/admin.sock; этот файл
# создаёт каталог сокета (владелец — пользователь службы caddy, режим 0700) и учит
# `systemctl reload caddy` ходить на сокет.
#
# Куда положить: /etc/systemd/system/caddy.service.d/admin-socket.conf (стоп-точка, sudo), затем
#   sudo systemctl daemon-reload && sudo systemctl restart caddy
# Именно restart, а не reload: работающий Caddy слушает admin API по прежнему адресу, и
# перечитывание настройки с новым адресом admin не проходит («dial unix …admin.sock: no such file»).
# Проверено на Ubuntu 24.04, пакет caddy 2.11.7, 2026-10-08.
[Service]
RuntimeDirectory=caddy-admin
RuntimeDirectoryMode=0700
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --address unix//run/caddy-admin/admin.sock --force
