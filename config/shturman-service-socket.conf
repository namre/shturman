# Каталог Unix-сокета сервиса переписки для обратного прокси (systemd-tmpfiles; решение Р-76).
#
# Зачем. Контейнер Hermes работает в сети хоста. Порт сервиса 127.0.0.1:8765, пока сервис
# перезапускается, свободен — процесс из Hermes может занять его, и Caddy отдавал бы ему то, что
# владелец вводит на странице настройки переписки. Поэтому Caddy ходит к сервису через Unix-сокет
# /run/shturman-service/proxy.sock в этом каталоге. Каталог подключён только контейнеру сервиса
# (compose.yaml): в файловой системе Hermes его нет. Права каталога — второй рубеж:
#   владелец — пользователь стека (тот, кто запускает ./ops/up.sh; под ним работает сервис):
#              создаёт и заменяет сокет;
#   группа   — caddy (пользователь службы Caddy): только вход в каталог, без записи;
#   режим    — 2710: setgid даёт сокету группу caddy, сервис ставит сокету 0660; остальным — ничего.
# Сервис открывает сокет, только если каталог именно такой (иначе остаётся на порту 8765), а
# ./ops/doctor.sh сверяет его в строке setup-socket.
#
# Куда положить (стоп-точка, sudo). Пользователь стека здесь — shturman; если стек запускает другой
# пользователь, команда ниже подставит его имя:
#   sed "s/ shturman caddy / $(id -un) caddy /" config/shturman-service-socket.conf \
#     | sudo tee /etc/tmpfiles.d/shturman-service.conf > /dev/null
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/shturman-service.conf
# /run очищается при перезагрузке; systemd-tmpfiles создаёт каталог заново при каждой загрузке,
# раньше Docker. Если каталог уже есть (его создал Docker от root, пока этого файла не было),
# systemd-tmpfiles --create приводит его владельца, группу и режим к этой строке. Затем
# ./ops/up.sh — сервис перезапустится и откроет сокет.
#
# Каталог и сокет нельзя подключать в контейнер Hermes и делать доступными другим пользователям;
# пользователь службы Caddy должен отличаться от пользователя стека (docs/runbooks/deploy.md, «Инварианты»).
#
# Тип  Путь                   Режим Владелец Группа Срок
d      /run/shturman-service  2710  shturman caddy  -
