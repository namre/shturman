name: shturman
version: 0.0.3
description: >
  Штурман: вход в дашборд по одноразовому коду от собственного бота владельца,
  привязка владельца к боту и мастер первой настройки (вкладка «Штурман»);
  мост к сервису переписки: исполнитель заданий, запись бизнес-сообщений в архив,
  инструменты агента и скиллы сводок.
author: "Evgenii Erman"
homepage: https://github.com/namre/shturman
kind: standalone
