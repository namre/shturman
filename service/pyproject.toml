[project]
name = "shturman-service"
version = "0.0.1"
description = "Сервис переписки «Штурмана»: архив Telegram, импорт экспорта, поиск"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "asyncpg>=0.30",   # Apache-2.0
  "ijson>=3.3",      # BSD-3-Clause
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
shturman = "shturman.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shturman = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
