[project]
name = "shturman-service"
version = "0.0.7"
description = "Сервис переписки «Штурмана»: архив Telegram, импорт экспорта, поиск"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "asyncpg>=0.30",        # Apache-2.0
  "ijson>=3.3",           # BSD-3-Clause
  "starlette>=0.47",      # BSD-3-Clause
  "uvicorn>=0.35",        # BSD-3-Clause
  "httpx[socks]>=0.28",          # BSD-3-Clause
  "mcp>=2.2,<3",          # MIT
  "telethon>=1.45,<2",    # MIT
  "segno>=1.6",           # BSD-3-Clause — QR-код для входа
  "pymorphy3>=2.0",       # MIT
  "pytrovich>=0.2",       # MIT
  "rapidfuzz>=3.9",       # MIT
  "dateparser>=1.2",      # BSD-3-Clause
  "tzdata>=2025.1",        # Apache-2.0 — часовые пояса: в урезанном образе системных может не быть
  "regex>=2024.4",        # Apache-2.0 — выражения наблюдателя с пределом времени
  "python-socks[asyncio]>=2.4",  # Apache-2.0 — исходящий прокси для Telegram
  "pyjwt>=2.10",          # MIT — подпись ID token при входе через ChatGPT (executor/siwc.py)
  "cryptography>=44",     # Apache-2.0 OR BSD-3-Clause — ключи RSA для этой проверки
  "pypdfium2>=5.13,<6",   # BSD-3-Clause / Apache-2.0; PDFium в колесе — BSD-3-Clause — текст и страницы PDF (media/extract.py)
  "pillow>=12.2,<13",     # MIT-CMU — фото и страницы сканов в JPEG для модели (media/extract.py)
  "openpyxl>=3.1,<4",     # MIT — таблицы XLSX (media/extract.py); с ним приходит et-xmlfile (MIT)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
shturman = "shturman.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shturman = ["migrations/*.sql", "setup_page/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
