name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  service:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: shturman_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SHTURMAN_TEST_DSN: postgresql://postgres@127.0.0.1:5432/shturman_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e './service[dev]'
      - run: pytest -q
        working-directory: service

  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      # Тест обработчиков Telegram пропускается сам: библиотека приходит только вместе с Hermes.
      - run: pytest -q plugins/shturman/tests
      - run: node --check plugins/shturman/dashboard/dist/index.js && node --check plugins/shturman/public/app.js
      - run: python -m json.tool plugins/shturman/dashboard/manifest.json > /dev/null && python -m json.tool plugins/shturman/personas.json > /dev/null

  ops:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning ops/*.sh
      # Оба режима установки. Без профилей (режим standalone) в стеке нет Hermes: его контейнер
      # не создаётся и образ не скачивается; с профилем hermes — прежний состав.
      - name: compose — режим без Hermes и режим с Hermes
        run: |
          docker compose config --quiet
          test "$(docker compose config --services | sort | tr '\n' ' ')" = "postgres shturman "
          if docker compose config --images | grep -q hermes-agent; then echo "образ Hermes в режиме без Hermes"; exit 1; fi
          docker compose --profile hermes config --quiet
          test "$(docker compose --profile hermes config --services | sort | tr '\n' ' ')" = "hermes postgres shturman "
          docker compose --profile hermes --profile embeddings --profile guard config --quiet
          test "$(docker compose --profile guard config --services | sort | tr '\n' ' ')" = "guard postgres shturman "
          # Модель поиска по смыслу: без строк в .env — прежняя модель из прежнего каталога (экземпляру,
          # развёрнутому раньше, править .env не нужно); со строками — выбранная. Сервис и контейнер
          # получают одно и то же имя модели. Печатается только команда контейнера эмбеддингов.
          emb() { docker compose --profile embeddings config --format json | python3 -c 'import json, sys; c = json.load(sys.stdin)["services"]; print(" ".join(c["embeddings"]["command"]), c["shturman"]["environment"]["SHTURMAN_EMBEDDINGS_MODEL"])'; }
          test "$(emb)" = "--model-id /data/model --served-model-name intfloat/multilingual-e5-small --max-batch-tokens 2048 intfloat/multilingual-e5-small"
          export SHTURMAN_EMBEDDINGS_MODEL=deepvk/USER2-small SHTURMAN_EMBEDDINGS_MODEL_DIR=user2-small
          test "$(emb)" = "--model-id /data/user2-small --served-model-name deepvk/USER2-small --max-batch-tokens 2048 deepvk/USER2-small"
          # Страница настройки переписки: сервис получает СВОЙ адрес страницы (SHTURMAN_SETUP_URL) и,
          # отдельно, адрес дашборда — только для сверки. Адрес дашборда адресом страницы не становится
          # никогда. Порт сервиса по-прежнему опубликован только на локальном адресе сервера.
          svc() { docker compose config --format json | python3 -c 'import json, sys; s = json.load(sys.stdin)["services"]["shturman"]; e = s["environment"]; print(e["SHTURMAN_SETUP_ORIGIN"] or "-", e["SHTURMAN_DASHBOARD_ORIGIN"] or "-", " ".join(p["host_ip"] + ":" + str(p["published"]) + ":" + str(p["target"]) for p in s["ports"]))'; }
          test "$(svc)" = "- - 127.0.0.1:8765:8765"
          export SHTURMAN_PUBLIC_URL=https://assistant.example.com
          test "$(svc)" = "- https://assistant.example.com 127.0.0.1:8765:8765"
          export SHTURMAN_SETUP_URL=https://assistant.example.com:8443
          test "$(svc)" = "https://assistant.example.com:8443 https://assistant.example.com 127.0.0.1:8765:8765"
        env:
          HERMES_UID: "1000"
          HERMES_GID: "1000"
          POSTGRES_PASSWORD: ci-only
          SHTURMAN_API_TOKEN: ci-only-api-token-0123456789abcdef0123
          SHTURMAN_MCP_TOKEN: ci-only-mcp-token-0123456789abcdef0123
      # Режим записывается в .env и ведёт за собой профили Compose; экземпляр без строки режима
      # остаётся режимом с Hermes и не теряет включённый поиск по смыслу.
      - name: ops — режим установки и профили
        run: |
          tmp="$(mktemp -d)"; cp -r ops .env.example "$tmp"/; cd "$tmp"
          # Вариант установки выбирает владелец: на новой установке без --mode скрипт не выбирает сам.
          grep -q 'режим установки: ещё не выбран' <<< "$(./ops/state.sh show)"
          if ./ops/init-env.sh --auto; then echo "вариант установки не должен выбираться молча"; exit 1; fi
          test ! -e .env
          ./ops/init-env.sh --auto --mode standalone
          grep -qx 'SHTURMAN_MODE=standalone' .env
          grep -qx 'COMPOSE_PROFILES=' .env
          ./ops/init-env.sh --auto
          if ./ops/init-env.sh --auto --mode hermes; then echo "режим не должен меняться молча"; exit 1; fi
          if ./ops/activation-link.sh; then echo "без Hermes ссылки входа нет"; exit 1; fi
          ./ops/mode.sh set hermes
          grep -qx 'SHTURMAN_MODE=hermes' .env
          grep -qx 'COMPOSE_PROFILES=hermes' .env
          printf 'POSTGRES_PASSWORD=x\nCOMPOSE_PROFILES=embeddings\n' > .env
          ./ops/init-env.sh --auto
          grep -qx 'SHTURMAN_MODE=hermes' .env
          grep -qx 'COMPOSE_PROFILES=hermes,embeddings' .env
          test "$(stat -c '%a' .env)" = "600"
          # Поиск по смыслу и защита включаются независимо: каждый скрипт убирает только свой
          # профиль и не трогает ни чужой, ни профиль Hermes. Запуск стека здесь подменён.
          printf '#!/bin/sh\nexit 0\n' > ops/up.sh
          printf 'SHTURMAN_MODE=hermes\nCOMPOSE_PROFILES=hermes,embeddings,guard\nSHTURMAN_GUARD=on\n' > .env
          ./ops/guard.sh off
          grep -qx 'COMPOSE_PROFILES=hermes,embeddings' .env
          if grep -q '^SHTURMAN_GUARD=' .env; then echo "выключатель защиты должен исчезнуть"; exit 1; fi
          ./ops/embeddings.sh off
          grep -qx 'COMPOSE_PROFILES=hermes' .env
          # Модель поиска по смыслу — только из перечня; без ключа — записанная в .env, иначе e5-small.
          # Скачивание модели здесь не запускается: проверяются разбор параметров и отказы.
          grep -qx 'модель: e5-small (intfloat/multilingual-e5-small)' <<< "$(./ops/embeddings.sh status)"
          if ./ops/embeddings.sh on --model bge-m3; then echo "модель не из перечня"; exit 1; fi
          if ./ops/embeddings.sh off --model e5-small; then echo "--model только вместе с on"; exit 1; fi
          printf 'SHTURMAN_EMBEDDINGS_MODEL=deepvk/USER2-small\n' >> .env
          grep -qx 'модель: user2-small (deepvk/USER2-small)' <<< "$(./ops/embeddings.sh status)"
          sed -i 's|^SHTURMAN_EMBEDDINGS_MODEL=.*|SHTURMAN_EMBEDDINGS_MODEL=acme/unknown|' .env
          if ./ops/embeddings.sh on; then echo "незнакомая модель в .env не должна молча заменяться"; exit 1; fi
          sed -i '/^SHTURMAN_EMBEDDINGS_MODEL=/d' .env
          grep -qx 'COMPOSE_PROFILES=hermes' .env
          ./ops/init-env.sh --auto > /dev/null
          grep -qx 'COMPOSE_PROFILES=hermes' .env
          test "$(stat -c '%a' .env)" = "600"
      # Адрес страницы настройки переписки. Она обязана стоять на отдельном адресе (origin), не на
      # адресе дашборда: на общем адресе ассистент в Hermes мог бы действовать на ней от имени
      # вошедшего владельца. По умолчанию — то же имя, порт 8443.
      - name: ops — адрес страницы настройки переписки
        run: |
          tmp="$(mktemp -d)"; cp -r ops "$tmp"/; cd "$tmp"
          printf 'SHTURMAN_MODE=hermes\nSHTURMAN_API_TOKEN=ci-only-secret-value\n' > .env; chmod 600 .env
          url() { grep -E "^$1=" .env | cut -d= -f2-; }
          # Адрес дашборда записывается вместе с адресом страницы по умолчанию — с портом.
          ./ops/set-public-url.sh https://assistant.example.com > out.txt
          test "$(url SHTURMAN_PUBLIC_URL)" = "https://assistant.example.com"
          test "$(url SHTURMAN_SETUP_URL)" = "https://assistant.example.com:8443"
          grep -q 'https://assistant.example.com:8443' out.txt
          if grep -q 'ci-only-secret-value' out.txt; then echo "скрипт напечатал чужую строку .env"; exit 1; fi
          # Совпадающий адрес — отказ с кодом 2 и объяснением; .env не меняется. Регистр, обычный порт
          # и косая черта на конце адрес другим не делают.
          before="$(cat .env)"
          for same in https://assistant.example.com https://ASSISTANT.example.com:443/ https://assistant.example.com:443; do
            code=0; ./ops/set-setup-url.sh "$same" > out.txt 2>&1 || code=$?
            [ "$code" -eq 2 ] || { echo "$same: код $code вместо 2"; exit 1; }
            grep -q 'ОТКАЗ' out.txt && grep -q 'Ничего не записано' out.txt
          done
          test "$(cat .env)" = "$before"
          # Не https, путь, имя пользователя, IP-адрес, неверный порт — тоже отказ.
          for bad in http://assistant.example.com:8443 https://assistant.example.com:8443/shturman-setup/ \
                     https://user@assistant.example.com:8443 https://10.0.0.1:8443 https://assistant.example.com:99999 assistant.example.com; do
            if ./ops/set-setup-url.sh "$bad" > /dev/null 2>&1; then echo "$bad: адрес не должен приниматься"; exit 1; fi
          done
          test "$(cat .env)" = "$before"
          # Другой порт и отдельное имя принимаются; адрес записывается в приведённом виде.
          ./ops/set-setup-url.sh https://Assistant.example.com:9443/ > /dev/null
          test "$(url SHTURMAN_SETUP_URL)" = "https://assistant.example.com:9443"
          ./ops/set-setup-url.sh https://setup.example.com > /dev/null
          test "$(url SHTURMAN_SETUP_URL)" = "https://setup.example.com"
          # Заданный вручную адрес set-public-url.sh не трогает, а занять его дашбордом не даёт.
          ./ops/set-public-url.sh https://new.example.com > /dev/null
          test "$(url SHTURMAN_SETUP_URL)" = "https://setup.example.com"
          if ./ops/set-public-url.sh https://setup.example.com > /dev/null 2>&1; then echo "адрес дашборда не должен совпасть с адресом страницы"; exit 1; fi
          test "$(url SHTURMAN_PUBLIC_URL)" = "https://new.example.com"
          # Убранный адрес остаётся убранным: строка пустая, по умолчанию её никто не возвращает.
          ./ops/set-setup-url.sh --clear > /dev/null
          grep -qx 'SHTURMAN_SETUP_URL=' .env
          printf '. ops/lib.sh\nensure_setup_url "$1"\n' > ensure.sh
          bash ensure.sh hermes
          grep -qx 'SHTURMAN_SETUP_URL=' .env
          # Экземпляр, развёрнутый до появления этой строки: ./ops/up.sh дописывает адрес по умолчанию
          # (здесь — та же функция, которой он пользуется), ничего другого в .env не меняя.
          printf 'SHTURMAN_MODE=hermes\nSHTURMAN_PUBLIC_URL=https://assistant.example.com\nSHTURMAN_API_TOKEN=ci-only-secret-value\n' > .env
          bash ensure.sh hermes > out.txt
          test "$(url SHTURMAN_SETUP_URL)" = "https://assistant.example.com:8443"
          test "$(grep -c . .env)" = "4" && grep -qx 'SHTURMAN_API_TOKEN=ci-only-secret-value' .env
          if grep -q 'ci-only-secret-value' out.txt; then echo "функция напечатала чужую строку .env"; exit 1; fi
          bash ensure.sh hermes; test "$(grep -c '^SHTURMAN_SETUP_URL=' .env)" = "1"
          grep -q 'ensure_setup_url "\$MODE"' ops/up.sh
          # Адрес дашборда без https или уже на порту 8443: адреса по умолчанию нет, строка не появляется.
          printf 'SHTURMAN_MODE=hermes\nSHTURMAN_PUBLIC_URL=http://assistant.example.com\n' > .env
          bash ensure.sh hermes; if grep -q '^SHTURMAN_SETUP_URL=' .env; then echo "для http адреса по умолчанию нет"; exit 1; fi
          # Без Hermes внешний адрес не задаётся вовсе, а ссылка входа — только на локальный адрес.
          printf 'SHTURMAN_MODE=standalone\nSHTURMAN_PUBLIC_URL=https://assistant.example.com\n' > .env
          bash ensure.sh standalone; if grep -q '^SHTURMAN_SETUP_URL=' .env; then echo "без Hermes адрес не пишется"; exit 1; fi
          code=0; ./ops/set-setup-url.sh https://assistant.example.com:8443 > /dev/null 2>&1 || code=$?
          [ "$code" -eq 2 ] || { echo "без Hermes адрес страницы не задаётся: код $code вместо 2"; exit 1; }
          if grep -q '^SHTURMAN_SETUP_URL=' .env; then echo "без Hermes адрес не пишется"; exit 1; fi
          # Ссылка входа строится только из адреса страницы: адрес дашборда в неё не попадает.
          if grep -Eq 'base=.*SHTURMAN_PUBLIC_URL' ops/setup-link.sh; then echo "ссылка входа не должна строиться из адреса дашборда"; exit 1; fi
          grep -q 'env_get SHTURMAN_SETUP_URL' ops/setup-link.sh
      # Образец настройки прокси: блок дашборда не отдаёт страницу настройки переписки и ничего
      # не проксирует на порт сервиса; из порта сервиса наружу выходит один префикс, во втором блоке.
      - name: прокси — страница настройки переписки только в своём блоке
        run: |
          f=config/Caddyfile.example
          block() { awk -v head="$1" '$0 == head {f=1} f {print} f && /^}/ {exit}' "$f" | grep -Ev '^[[:space:]]*#'; }
          dash="$(block 'assistant.example.com {')"; setup="$(block 'assistant.example.com:8443 {')"
          [ -n "$dash" ] && [ -n "$setup" ] || { echo "в образце должно быть два блока сайта"; exit 1; }
          # Блок дашборда: порта сервиса нет вовсе, а на /shturman-setup* стоит явный отказ.
          if grep -q '8765' <<< "$dash"; then echo "блок дашборда не должен проксировать на порт сервиса"; exit 1; fi
          test "$(grep -c 'shturman-setup' <<< "$dash")" = "1"
          grep -Eq '^[[:space:]]*@no_setup_page path /shturman-setup\*$' <<< "$dash"
          grep -A1 -E '^[[:space:]]*handle @no_setup_page \{$' <<< "$dash" | grep -Eq '^[[:space:]]*respond 404$'
          test "$(grep -c 'reverse_proxy' <<< "$dash")" = "1" && grep -Eq '^[[:space:]]*reverse_proxy 127\.0\.0\.1:9119$' <<< "$dash"
          # Блок страницы: один выход на порт сервиса, только под префиксом; дашборда нет; остальное — отказ.
          test "$(grep -c 'reverse_proxy' <<< "$setup")" = "1" && grep -Eq '^[[:space:]]*reverse_proxy 127\.0\.0\.1:8765$' <<< "$setup"
          if grep -q '9119' <<< "$setup"; then echo "в блоке страницы настройки не должно быть дашборда"; exit 1; fi
          grep -B1 -E '^[[:space:]]*reverse_proxy 127\.0\.0\.1:8765$' <<< "$setup" | grep -Eq '^[[:space:]]*handle @setup_page \{$'
          grep -q '@setup_page expression' <<< "$setup" && grep -q '\^/shturman-setup/' <<< "$setup"
          grep -Eq '^[[:space:]]*respond 404$' <<< "$setup"
          grep -q 'Strict-Transport-Security' <<< "$setup"
          # Заголовок Host не подменяется, журнал запросов не включён — ни в одном блоке.
          if grep -Ev '^[[:space:]]*#' "$f" | grep -Eq 'header_up[[:space:]]+Host|^[[:space:]]*log([[:space:]]|$)'; then echo "Host не подменяется, журнал не включается"; exit 1; fi
          # Настройку проверяет сам Caddy той версии, с которой она проверена.
          docker run --rm -v "$PWD/$f:/etc/caddy/Caddyfile:ro" caddy:2.10.2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      # Справка и неизвестные ключи. На -h и --help каждый скрипт печатает своё назначение и выходит
      # с кодом 0 до любых действий: в каталоге без .env и данных он ничего не создаёт и не зовёт
      # ни Docker, ни curl (вместо них подставлены заглушки, которые записывают вызов). На
      # неизвестный ключ — сообщение и код 2, тоже без действий. Так ./ops/activation-link.sh --help
      # не выпустит настоящую ссылку входа.
      - name: ops — справка и неизвестные ключи
        run: |
          tmp="$(mktemp -d)"; cp -r ops "$tmp"/; mkdir "$tmp/stub" "$tmp/empty"
          for tool in docker curl ssh; do
            printf '#!/bin/sh\necho "%s $*" >> "%s/called"\nexit 1\n' "$tool" "$tmp" > "$tmp/stub/$tool"
          done
          chmod +x "$tmp"/stub/*
          export PATH="$tmp/stub:$PATH"
          cd "$tmp/empty"
          listing() { find "$tmp" | sort; }
          before="$(listing)"
          run() { code=0; out="$(bash "$@" < /dev/null 2>&1)" || code=$?; }
          for f in ../ops/*.sh; do
            for key in --help -h; do
              run "$f" "$key"
              [ "$code" -eq 0 ] || { echo "$f $key: код $code вместо 0"; exit 1; }
              [ -n "$out" ] || { echo "$f $key: справка пустая"; exit 1; }
            done
            run "$f" --no-such-key
            [ "$code" -eq 2 ] || { echo "$f --no-such-key: код $code вместо 2"; exit 1; }
            grep -q 'no-such-key' <<< "$out" || { echo "$f --no-such-key: в сообщении нет имени ключа"; exit 1; }
          done
          # Справка побеждает и после других параметров; лишний параметр — тоже ошибка, а не действие.
          for args in "up.sh --pull --help" "guard.sh on --help" "embeddings.sh on --model e5-small --help" \
                      "mode.sh set standalone --help" "setup-link.sh --local --help" "backup.sh --list --help"; do
            # shellcheck disable=SC2086
            run ../ops/$args
            [ "$code" -eq 0 ] || { echo "$args: код $code вместо 0"; exit 1; }
          done
          for args in "activation-link.sh сейчас" "bot-bind.sh x" "setup-link.sh x" "guard.sh on x" \
                      "backup.sh x" "doctor.sh x" "preflight.sh x" "logout-all.sh x" "up.sh x" \
                      "set-setup-url.sh --clear https://assistant.example.com:8443" "set-setup-url.sh a b"; do
            # shellcheck disable=SC2086
            run ../ops/$args
            [ "$code" -eq 2 ] || { echo "$args: код $code вместо 2"; exit 1; }
          done
          test "$(listing)" = "$before"
          if [ -e "$tmp/called" ]; then echo "справка обратилась к внешней программе:"; cat "$tmp/called"; exit 1; fi
          # Без Hermes и без запущенного сервиса ссылка настройки переписки не выдаётся; из .env
          # читаются только режим и адреса дашборда и страницы настройки.
          cd "$tmp"; printf 'SHTURMAN_MODE=standalone\n' > .env
          if ./ops/setup-link.sh > link.out 2>&1; then echo "без сервиса ссылки быть не должно"; exit 1; fi
          grep -q 'не запущен' link.out
      # Образ сервиса должен собираться и запускаться: без базы он обязан выйти с понятной ошибкой.
      - run: docker build -t shturman-service:ci service
      - run: docker run --rm shturman-service:ci --help
